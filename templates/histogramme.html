<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Températures Paris — Google HistoChart</title>

    <script src="https://www.gstatic.com/charts/loader.js"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 24px;
        }

        #chart {
            width: 100%;
            height: 520px;
        }

        #status {
            margin-top: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>Températures horaires — Paris</h1>
    <div id="chart"></div>
    <div id="status"></div>

    <script>
        google.charts.load('current', { packages: ['corechart'] });
        google.charts.setOnLoadCallback(init);

        let cachedRows = null;

        async function init() {
            try {
                const rows = await fetchParisData();
                cachedRows = rows;
                drawChart(rows);

                window.addEventListener('resize', () => {
                    if (cachedRows) drawChart(cachedRows);
                });
            } catch (err) {
                showStatus("Erreur: " + (err?.message || err));
                console.error(err);
            }
        }

        async function fetchParisData() {
            const res = await fetch('/paris', { headers: { 'Accept': 'application/json' } });

            if (!res.ok) {
                throw new Error(`HTTP ${res.status} sur /paris`);
            }

            const json = await res.json();

            // json attendu: [{ datetime: "2026-02-15T00:00", temperature_c: 0.5 }, ...]
            // Retourner uniquement les températures pour l’histogramme.
            const rows = json.map(p => [Number(p.temperature_c)]).filter(r => Number.isFinite(r[0]));
            return rows;
        }

        function drawChart(rows) {
            const data = new google.visualization.DataTable();
            data.addColumn('number', 'Température (°C)');
            data.addRows(rows);

            const options = {
                title: 'Distribution des températures horaires à Paris',
                legend: { position: 'none' },
                hAxis: {
                    title: 'Température (°C)'
                },
                vAxis: {
                    title: 'Nombre d’heures'
                },
                histogram: {
                    bucketSize: 1,
                    lastBucketPercentile: 5,
                    showItemDividers: false
                }
            };

            const chart = new google.visualization.Histogram(document.getElementById('chart'));
            chart.draw(data, options);

            showStatus(`OK — ${rows.length} températures chargées depuis /paris`);
        }

        function showStatus(msg) {
            document.getElementById('status').textContent = msg;
        }
    </script>
</body>

</html>
